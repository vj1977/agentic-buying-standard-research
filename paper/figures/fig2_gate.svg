<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-labelledby="fig2-title fig2-desc" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<title id="fig2-title">Optimised attack success at E3 within the same calls, before and after the provenance gate</title>
<desc id="fig2-desc">Grouped bar chart with Wilson 95% intervals. Share of attacked case-sides in which the Phase 3 final payload at evidence level E3 got the arbiter to decide for the lying party, within the same calls: before the evidence-provenance gate, after the gate as run (v1), and after gate v3, which is exploratory (written after the reviews with these outputs in view; gate v2 gives the same counts); by arbiter and by the side that lied. A1 claude-fable-5-1: buyer side 7/7 before the gate, 1/7 with gate v1, 0/7 with gate v3; merchant side 4/7 before the gate, 0/7 with gate v1, 0/7 with gate v3. A1 grok-4.7: buyer side 7/7 before the gate, 0/7 with gate v1, 0/7 with gate v3; merchant side 5/7 before the gate, 1/7 with gate v1, 0/7 with gate v3. A2 hybrid: buyer side 7/7 before the gate, 3/7 with gate v1, 0/7 with gate v3; merchant side 0/7 before the gate, 0/7 with gate v1, 0/7 with gate v3. Most A1 rejections by gate v1 were format failures: fable 10 format, 2 provenance, 0 contradiction; grok 13, 0, 0.</desc>

<text x="56" y="155.3" font-size="12" fill="#666666" text-anchor="end">80</text>
<line x1="64" y1="110.7" x2="470" y2="110.7" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="114.7" font-size="12" fill="#666666" text-anchor="end">90</text>

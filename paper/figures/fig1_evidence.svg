<text x="18" y="192" font-size="12.5" fill="#454545" text-anchor="middle" transform="rotate(-90 18 192)">Liable party correct (%)</text>
<text x="98" y="333" font-size="13" fill="#1f1f1f" text-anchor="middle" font-weight="600">E0</text>
<text x="98" y="349" font-size="11" fill="#666666" text-anchor="middle">card-dispute data</text>
<text x="210.7" y="333" font-size="13" fill="#1f1f1f" text-anchor="middle" font-weight="600">E1</text>
<text x="210.7" y="349" font-size="11" fill="#666666" text-anchor="middle">+ signed mandate</text>
<text x="323.3" y="333" font-size="13" fill="#1f1f1f" text-anchor="middle" font-weight="600">E2</text>
<text x="323.3" y="349" font-size="11" fill="#666666" text-anchor="middle">+ action log</text>
<text x="436" y="333" font-size="13" fill="#1f1f1f" text-anchor="middle" font-weight="600">E3</text>
<text x="436" y="349" font-size="11" fill="#666666" text-anchor="middle">+ snapshots, delivery</text>
<text x="267" y="370" font-size="12.5" fill="#454545" text-anchor="middle">Evidence level (cumulative)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380" role="img" aria-labelledby="fig1-title fig1-desc" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<title id="fig1-title">Liable-party accuracy by evidence level (Phase 2, A1 arbiters)</title>
<desc id="fig1-desc">Line chart with 95% Wilson intervals. Share of the 51 Phase 2 dispute cases in which the end-to-end arbiter assigned the liable party correctly, at evidence levels E0 to E3, scored against the historical rulebook v1.2 labels. claude-fable-5-1: E0 42/51 = 82% [70, 90], E1 43/51 = 84% [72, 92], E2 46/51 = 90% [79, 96], E3 50/51 = 98% [90, 100]. grok-4.7: E0 31/51 = 61% [47, 73], E1 37/51 = 73% [59, 83], E2 46/51 = 90% [79, 96], E3 49/51 = 96% [87, 99].</desc>
<rect x="0" y="0" width="600" height="380" fill="#ffffff"/>
<text x="16" y="26" font-size="15.5" fill="#1f1f1f" font-weight="600">Liable-party accuracy rises with the evidence level</text>
<text x="16" y="46" font-size="12" fill="#666666">A1 end-to-end arbiters, 51 cases per level, historical rulebook v1.2 labels; bars are Wilson 95% intervals</text>
<line x1="64" y1="314" x2="470" y2="314" stroke="#e6e6e6" stroke-width="1"/>
<text x="56" y="318" font-size="12" fill="#666666" text-anchor="end">40</text>

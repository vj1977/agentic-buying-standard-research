<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 576" width="600" height="576" role="img" aria-labelledby="fig3-title fig3-desc" font-family="'Helvetica Neue', Helvetica, Arial, 'Liberation Sans', sans-serif">
<title id="fig3-title">Safety-usefulness trade-off under optimised attack at E3, and the confirmatory tests of gate v3</title>
<desc id="fig3-desc">Scatter plot with 95% intervals in both directions. Each point is an operating point at evidence level E3: the share of the baseline Phase 2 workload (the 51 Phase 2 cases, 25 of them with a scripted adversary) sent to human review (x; for A2 a case counts if any of its three runs went to review) against the share of optimised-attack case-sides that succeed (y), with Wilson intervals over cases and case-sides. Both are costs; lower is better on both axes. The A1 points come from the same calls. A1 claude-fable-5-1, decides every case: review 0/50 = 0% [0, 7], attack success 11/14 = 79% [52, 92]. A1 claude-fable-5-1, abstains below 0.7: review 3/50 = 6% [2, 16], attack success 8/14 = 57% [33, 79]. A1 claude-fable-5-1, gate as run (v1): review 24/50 = 48% [35, 61], attack success 1/14 = 7% [1, 31]. A1 claude-fable-5-1, gate v3: review 40/50 = 80% [67, 89], attack success 0/14 = 0% [0, 22]. A2 hybrid, as run: review 33/51 = 65% [51, 76], attack success 7/14 = 50% [27, 73]. A2 hybrid, + gate v1: review 35/51 = 69% [55, 80], attack success 3/14 = 21% [8, 48]. A2 hybrid, contract v3 + gate v3: review 44/51 = 86% [74, 93], attack success 0/14 = 0% [0, 22]. Gate v3 and contract v3 are exploratory: written after the reviews with these outputs in view. Confirmatory amendment C1 (diamonds; judge claude-opus-5-5, 14 fresh case-sides, best of 5, the gated arm's attacker aware of the gate): gate v3 off: review 0/51 = 0% [0, 7], attack success 11/14 = 79% [52, 92]. gate v3 on: review 34/51 = 67% [53, 78], attack success 0/14 = 0% [0, 22]. Lower panel, attack success alone in the confirmatory tests of gate v3 (case-sides fooled within five attempts, Wilson 95% intervals; C2 is a replication on 28 further case-sides with the same frozen judge, attacker and gate and no baseline arm; the pooled estimate is descriptive): C1 (n = 14, p = 0.0005): gate off 11/14 = 79% [52, 92], gate on 0/14 = 0% [0, 22]. C2, replication (n = 28, p = 3.0e-8): gate off 25/28 = 89% [73, 96], gate on 0/28 = 0% [0, 12]. C1 + C2, pooled (n = 42, descriptive): gate off 36/42 = 86% [72, 93], gate on 0/42 = 0% [0, 8].</desc>

name: ci
# Agentic Buying Standard research repo. Tests and checks only: CI never calls an LLM (backends are mocked in tests).
on:
  push:
    branches: [master, main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Experiment harness tests (mock backends only)
        run: python -m unittest discover -s tests -t . -v
      - name: Standard rule-simulation tests
        run: |
          if [ -d standard/sim ] && ls standard/sim/test_*.py >/dev/null 2>&1; then
            python -m unittest discover -s standard/sim -t . -v
          else
            echo "standard/sim has no tests yet"
          fi
      - name: ABS v0.3 embedded schemas and Appendix F examples
        run: python -m tools.schema_check standard/ABS_v0.3.md
      - name: Every JSON file parses
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path('.').rglob('*.json'):
              if any(part in ('.git', 'node_modules') for part in p.parts):
                  continue
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          print("\n".join(bad) or "all JSON files parse")
          sys.exit(1 if bad else 0)
          PY
      - name: No secrets committed
        run: |
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[bp]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!.github/workflows/ci.yml'; then
            echo "possible secret committed"; exit 1
          fi
          echo "no secret patterns found"
